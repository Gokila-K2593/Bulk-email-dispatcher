services:
  db:
    image: postgres:15-alpine
    env_file:
      - .env
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  mailpit:
    image: axllent/mailpit:v1.15
    ports:
      - "8025:8025" # Web Dashboard UI
      - "1025:1025" # SMTP server port

  app:
    build: .
    depends_on:
      - db
      - redis
      - mailpit
    env_file:
      - .env
    environment:
      - REDIS_HOST=redis
      - DATABASE_URL=postgresql://user:password@db:5432/bulk_email_db?schema=public
      - SMTP_HOST=mailpit
      - SMTP_PORT=1025
    ports:
      - "3000:3000"
    command: npm run start

  worker:
    build: .
    depends_on:
      - db
      - redis
      - mailpit
    env_file:
      - .env
    environment:
      - REDIS_HOST=redis
      - DATABASE_URL=postgresql://user:password@db:5432/bulk_email_db?schema=public
      - SMTP_HOST=mailpit
      - SMTP_PORT=1025
    command: npm run worker

volumes:
  postgres_data: